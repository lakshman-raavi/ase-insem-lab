spring.application.name=sec56-skill-2-productService

server.port=8001

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/skill-2-productdb
spring.datasource.username=postgres
spring.datasource.password=Lucky@630

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Eureka
eureka.client.service-url.defaultZone=http://localhost:5555/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

eureka.instance.instance-id=${spring.application.name}:${server.port}